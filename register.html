<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #2a2929;
      color: #ebe7e7;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #d98e2b;
      color: white;
      padding: 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      text-align: center;
    }

    .container {
      background-color: #3a3a3a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      align-self: center;
      text-align: center;
      justify-content: center;
      padding: 2rem;
      margin: 2rem;
      border-radius: 10px;
    }

    main p {
      margin: 1rem 0 2rem;
      font-size: 1rem;
      max-width: 300px;
    }

    .btn {
      display: block;
      width: 200px;
      padding: 0.8rem 0;
      margin: 0.5rem 0;
      background-color: #d98e2b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #d98e2b;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.8rem;
      color: #888;
    }

    label {
      align-self: flex-start;
      font-size: 0.9rem;
    }

    input[type="text"], input[type="password"], input[type="date"] {
      width: 100%;  
      padding: 0.8rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
    }

    @media(min-width: 600px) {
      main p {
        max-width: 500px;
        font-size: 1.1rem;
      }

      .btn {
        width: 250px;
        font-size: 1.1rem;
      }
    }
    </style>
</head>
<body>
    <header>
        <h1>Register</h1>
    </header>
    <div class="container">
        <!-- <label for="name">Name:</label>
        <input type="text" name="Name" id="name" placeholder="Name">

        <label for="email">Email:</label>
        <input type="text" name="Email" id="email" placeholder="Email">

        <label for="password">Password:</label>
        <input type="password" name="Password" id="password" placeholder="Password">

        <button class="btn" type="button">Next</button> -->

        <!-- Második oldal -->

        <label for="dob">Date of Birth:</label>
        <input type="date" name="Date of Birth" id="dob" placeholder="Date of Birth">

        <label for="gender">Gender:</label>
        <input type="text" name="Gender" id="gender" placeholder="Gender">

        <label for="height">Height:</label>
        <input type="text" name="Height" id="height" placeholder="Height">

        <label for="weight">Weight:</label>
        <input type="text" name="Weight" id="weight" placeholder="Weight">

        <label for="lifestyle">Lifestyle:</label>
        <input type="text" name="lifestyle" id="lifestyle" placeholder="Lifestyle">

        <label for="goalWeight">Goal Weight:</label>
        <input type="text" name="goalWeight" id="goalWeight" placeholder="Goal Weight">

        <button class="btn" type="button">Register</button>
    </div>
    <footer>
    &copy; 2026 Fit App. Minden jog fenntartva.
    </footer>
</body>
</html>
