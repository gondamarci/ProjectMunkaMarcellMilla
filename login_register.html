<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fit App - Kalóriaszámláló</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #2a2929;
      color: #ebe7e7;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #d98e2b;
      color: white;
      padding: 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      text-align: center;
    }

    main p {
      margin: 1rem 0 2rem;
      font-size: 1rem;
      max-width: 300px;
    }

    .btn {
      display: block;
      width: 200px;
      padding: 0.8rem 0;
      margin: 0.5rem 0;
      background-color: #d98e2b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #d98e2b;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.8rem;
      color: #888;
    }

    @media(min-width: 600px) {
      main p {
        max-width: 500px;
        font-size: 1.1rem;
      }

      .btn {
        width: 250px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Fit App</h1>
    <p>Kalóriaszámláló, ami segít elérni a céljaidat!</p>
  </header>
  <main>
    <p>Kezdd el ma a tudatos étkezést és kövesd a napi kalóriabeviteled egyszerűen és gyorsan.</p>
    <a href="#" class="btn">Regisztráció</a>
    <a href="#" class="btn">Belépés</a>
  </main>
  <footer>
    &copy; 2026 Fit App. Minden jog fenntartva.
  </footer>
</body>
</html>
